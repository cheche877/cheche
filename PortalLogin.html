<!Doctype html>
<html>
<head>
    <!-- Page title -->
    <title>TechNova Solutions - Employee Portal Login</title>

    <style>
        /* Page background and basic font */
        body {
            background-color: #eaf4e6;
            font-family: Arial, sans-serif;
        }

        /* Main login table */
        table {
            width: 450px;
            margin: 60px auto;
            border: 2px solid #3b7a3b;
            border-collapse: collapse;
            background-color: white;
        }

        /* Table header */
        thead {
            background-color: #2f6b2f;
            color: white;
        }

        /* Portal Login heading */
        h2 {
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        /* Form input rows */
        tbody td {
            padding: 10px;
        }

        /* Text labels */
        tbody td:first-child {
            color: #2f6b2f;
            font-weight: bold;
            text-align: right;
        }

        /* Username and password fields */
        input[type="text"],
        input[type="password"] {
            width: 200px;
            padding: 8px;
            border: 2px solid #6fa66f;
            background-color: #f0f8ed;
        }

        /* Submit button */
        input[type="submit"] {
            background-color: #2f6b2f;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        /* Reset button */
        input[type="reset"] {
            background-color: #76b876;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        /* Footer text */
        tfoot td {
            padding: 15px;
            text-align: center;
            color: #4f804f;
        }
    </style>
</head>

<body>

    <!-- Main login form -->
    <form>

        <!-- Login table structure -->
        <table align="center">

            <!-- Table Header -->
            <thead>
                <tr>
                    <td colspan="2">
                        <h2>Portal Login</h2>
                    </td>
                </tr>
            </thead>

            <!-- Form Inputs -->
            <tbody>
                <tr>
                    <td>Username:</td>
                    <td>
                        <input
                            type="text"
                            placeholder="Enter Username"
                        >
                    </td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td>
                        <input
                            type="password"
                            placeholder="Enter Password"
                        >
                    </td>
                </tr>
            </tbody>

            <!-- Buttons and Student Information -->
            <tfoot>
                <tr>
                    <td colspan="2">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        Created by: Chelsea Tabarnilla12-Cooper
                    </td>
                </tr>
            </tfoot>
            <tr>
                <a href = "PortalLogin.html">  Portal Login </a>
            </tr>
        </table>
    
    </form>

</body>
</html>
