<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        :root {
            --purple-dark: #4a148c;
            --purple-main: #6a1b9a;
            --purple-light: #f3e5f5;
            --white: #ffffff;
            --text-dark: #2c0b4e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--white);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--purple-dark);
            padding: 0.75rem 1.5rem;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 1rem;
        }

        .nav-link {
            display: inline-block;
            color: var(--white);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            background-color: var(--purple-main);
            color: var(--white);
        }

        .nav-link.active {
            background-color: var(--white);
            color: var(--purple-dark);
            font-weight: 600;
        }

        .content {
            flex: 1;
            max-width: 720px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            text-align: center;
        }

        .content h1 {
            color: var(--purple-dark);
            margin-bottom: 0.5rem;
        }

        .content p {
            color: var(--purple-main);
            margin-bottom: 1.5rem;
        }

        /* New styles for the social links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-block;
            background-color: var(--purple-main);
            color: var(--white);
            text-decoration: none;
            padding: 0.65rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .social-btn:hover,
        .social-btn:focus-visible {
            background-color: var(--purple-dark);
        }

        .footer {
            background-color: var(--purple-dark);
            color: var(--white);
            text-align: center;
            padding: 1rem 1.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main Navigation">
        <ul class="nav-list">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main class="content">
        <h1>Contact</h1>
        <p>This is my Facebook and Instagram—you can message me there!</p>
        
        <div class="social-links">
            <a class="social-btn" href="https://www.facebook.com/yourusername" target="_blank" rel="noopener noreferrer">Facebook</a>
            <a class="social-btn" href="https://www.instagram.com/yourusername" target="_blank" rel="noopener noreferrer">Instagram</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>
</body>
</html>
