<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - che.homes</title>
    <style>
        :root {
            --purple-dark: #4a148c;
            --purple-main: #6a1b9a;
            --purple-accent: #7b1fa2;
            --purple-soft: #ede7f6;
            --bg-lavender: #f6f2fb;
            --white: #ffffff;
            --text-dark: #240842;
            --shadow-card: 0 4px 12px rgba(74, 20, 140, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-lavender);
            background-image:
                linear-gradient(rgba(246, 242, 251, 0.82), rgba(246, 242, 251, 0.82)),
                url("sailormoon.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--purple-main);
            padding: 0 2.5rem;
            border-bottom: 3px solid var(--white);
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 0.5rem;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            color: var(--white);
            text-decoration: none;
            padding: 0.9rem 1.4rem;
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            background-color: var(--purple-dark);
        }

        .nav-link.active {
            background-color: var(--white);
            color: var(--purple-dark);
            font-weight: 700;
        }

        .page-banner {
            background-color: var(--purple-dark);
            color: var(--white);
            text-align: center;
            padding: 1.6rem 1.5rem;
            border-bottom: 4px solid var(--white);
        }

        .page-banner h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .content {
            flex: 1;
            width: 100%;
            max-width: 1140px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .contact-card {
            position: relative;
            max-width: 760px;
            margin: 0 auto;
            padding: 2.5rem 2.25rem;
            background-color: var(--white);
            border-radius: 10px;
            box-shadow: var(--shadow-card);
            text-align: center;
            overflow: hidden;
        }

        .contact-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 7px;
            background-color: var(--purple-accent);
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
        }

        .contact-card h2 {
            color: var(--purple-dark);
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .contact-card p {
            color: var(--text-dark);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .social-link {
            display: inline-block;
            padding: 0.75rem 1.6rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            background-color: var(--purple-main);
            color: var(--white);
            border: 2px solid var(--purple-main);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .social-link:hover,
        .social-link:focus-visible {
            background-color: var(--purple-dark);
            border-color: var(--purple-dark);
            transform: translateY(-2px);
        }

        .footer {
            background-color: var(--purple-main);
            color: var(--white);
            text-align: center;
            padding: 0.9rem 1.5rem;
            font-size: 0.9rem;
            border-top: 3px solid var(--white);
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 0 1rem;
            }

            .contact-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
