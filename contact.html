<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        :root {
            --purple-dark: #4a148c;
            --purple-main: #6a1b9a;
            --purple-accent: #7b1fa2;
            --bg-lavender: #f6f2fb;
            --white: #ffffff;
            --text-dark: #240842;
            --shadow-card: 0 4px 12px rgba(74, 20, 140, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-lavender);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        .navbar {
            background-color: var(--purple-main);
            padding: 0 2.5rem;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 0.5rem;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            color: var(--white);
            text-decoration: none;
            padding: 0.9rem 1.4rem;
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            background-color: var(--purple-dark);
        }

        .nav-link.active {
            background-color: var(--white);
            color: var(--purple-dark);
            font-weight: 700;
        }

        /* Page Title Banner */
        .page-banner {
            background-color: var(--purple-dark);
            color: var(--white);
            text-align: center;
            padding: 1.6rem 1.5rem;
        }

        .page-banner h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        /* Main Content Area */
        .content {
            flex: 1;
            width: 100%;
            max-width: 1140px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        /* White Card with Purple Top Accent */
        .contact-card {
            position: relative;
            max-width: 760px;
            margin: 0 auto;
            padding: 2.5rem 2.25rem;
            background-color: var(--white);
            border-radius: 10px;
            box-shadow: var(--shadow-card);
            text-align: center;
            overflow: hidden;
        }

        .contact-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 7px;
            background-color: var(--purple-accent);
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
        }

        .contact-card h2 {
            color: var(--purple-dark);
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .contact-card p {
            color: var(--text-dark);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-block;
            background-color: var(--purple-main);
            color: var(--white);
            text-decoration: none;
            padding: 0.7rem 1.6rem;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .social-btn:hover,
        .social-btn:focus-visible {
            background-color: var(--purple-dark);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            background-color: var(--purple-main);
            color: var(--white);
            text-align: center;
            padding: 0.9rem 1.5rem;
            font-size: 0.9rem;
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 0 1rem;
            }

            .contact-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main Navigation">
        <ul class="nav-list">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="page-banner">
        <h1>Contact</h1>
    </header>

    <main class="content">
        <div class="contact-card">
            <h2>Get in Touch</h2>
            <p>This is my Facebook and Instagram—you can message me there!</p>
            <div class="social-links">
                <a class="social-btn" href=" https://www.facebook.com/share/1Pfd8AR22V/?mibextid=wwXIfr
  " target="_blank" rel="noopener noreferrer">Facebook</a>
                <a class="social-btn" href="https://www.instagram.com/yourusername" target="_blank" rel="noopener noreferrer">Instagram</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Contact | Tabarnilla Chelsea Mae</p>
    </footer>
</body>
</html>
