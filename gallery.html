<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        :root {
            --purple-dark: #4a148c;
            --purple-main: #6a1b9a;
            --purple-accent: #7b1fa2;
            --bg-lavender: #f6f2fb;
            --white: #ffffff;
            --text-dark: #240842;
            --shadow-card: 0 4px 12px rgba(74, 20, 140, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-lavender);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        .navbar {
            background-color: var(--purple-main);
            padding: 0 2.5rem;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 0.5rem;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            color: var(--white);
            text-decoration: none;
            padding: 0.9rem 1.4rem;
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            background-color: var(--purple-dark);
        }

        .nav-link.active {
            background-color: var(--white);
            color: var(--purple-dark);
            font-weight: 700;
        }

        /* Page Title Banner */
        .page-banner {
            background-color: var(--purple-dark);
            color: var(--white);
            text-align: center;
            padding: 1.6rem 1.5rem;
        }

        .page-banner h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        /* Main Content Area */
        .content {
            flex: 1;
            width: 100%;
            max-width: 1140px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .gallery-intro {
            text-align: center;
            color: var(--purple-dark);
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        /* Photo Grid with Matching White Cards */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .photo-card {
            position: relative;
            background-color: var(--white);
            border-radius: 10px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .photo-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 7px;
            background-color: var(--purple-accent);
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 1;
        }

        .photo-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(74, 20, 140, 0.14);
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: 230px;
            object-fit: cover;
            background-color: #ece3f7;
        }

        .photo-caption {
            padding: 0.9rem 1.1rem;
            text-align: center;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        /* Footer */
        .footer {
            background-color: var(--purple-main);
            color: var(--white);
            text-align: center;
            padding: 0.9rem 1.5rem;
            font-size: 0.9rem;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 0 1rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main Navigation">
        <ul class="nav-list">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="page-banner">
        <h1>Gallery</h1>
    </header>

    <main class="content">
        <p class="gallery-intro">My Photos &lt;3</p>

        <div class="gallery-grid">
            <div class="photo-card">
                <img src="photo1.jpg" alt="Photo 1">
                <div class="photo-caption">Photo 1</div>
            </div>

            <div class="photo-card">
                <img src="photo2.jpg" alt="Photo 2">
                <div class="photo-caption">Photo 2</div>
            </div>

            <div class="photo-card">
                <img src="photo3.jpg" alt="Photo 3">
                <div class="photo-caption">Photo 3</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Gallery | Tabarnilla Chelsea Mae</p>
    </footer>
</body>
</html>
