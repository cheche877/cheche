<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - che.homes</title>
    <style>
        :root {
            --purple-dark: #4a148c;
            --purple-main: #6a1b9a;
            --purple-accent: #7b1fa2;
            --bg-lavender: #f6f2fb;
            --white: #ffffff;
            --text-dark: #240842;
            --shadow-card: 0 4px 12px rgba(74, 20, 140, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-lavender);
            background-image:
                linear-gradient(rgba(246, 242, 251, 0.82), rgba(246, 242, 251, 0.82)),
                url("sailormoon.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--purple-main);
            padding: 0 2.5rem;
            border-bottom: 3px solid var(--white);
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 0.5rem;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            color: var(--white);
            text-decoration: none;
            padding: 0.9rem 1.4rem;
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            background-color: var(--purple-dark);
        }

        .nav-link.active {
            background-color: var(--white);
            color: var(--purple-dark);
            font-weight: 700;
        }

        .page-banner {
            background-color: var(--purple-dark);
            color: var(--white);
            text-align: center;
            padding: 1.6rem 1.5rem;
            border-bottom: 4px solid var(--white);
        }

        .page-banner h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .content {
            flex: 1;
            width: 100%;
            max-width: 1140px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .grid-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1.15rem;
        }

        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 110px;
            padding: 1.25rem 1rem;
            background-color: var(--white);
            color: var(--purple-dark);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            border-top: 5px solid var(--purple-accent);
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .box:hover,
        .box:focus-visible {
            transform: translateY(-4px);
            background-color: var(--purple-main);
            color: var(--white);
            box-shadow: 0 8px 18px rgba(74, 20, 140, 0.2);
        }

        .footer {
            background-color: var(--purple-main);
            color: var(--white);
            text-align: center;
            padding: 0.9rem 1.5rem;
            font-size: 0.9rem;
            border-top: 3px solid var(--white);
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main Navigation">
        <ul class="nav-list">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link active" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="page-banner">
        <h1>Portfolio</h1>
    </header>

    <main class="content">
        <div class="grid-container">
            <a href="FormElements.html" class="box">Form Elements</a>
            <a href="PortalLogin.html" class="box">Portal Login</a>
            <a href="console.html" class="box">JavaScript</a>
            <a href="sample.html" class="box">Sample</a>
            <a href="discount.html" class="box">Discount Calculator</a>
            <a href="PersonalDeveloper.html" class="box">.NET Developer Profile</a>
            <a href="studentlist.html" class="box">Tabular Student Data</a>
            <a href="classsched.html" class="box">Class Schedule</a>
            <a href="stylesched.html" class="box">Style Schedule</a>
            <a href="grid.html" class="box">Grid</a>
            <a href="savegrades.html" class="box">Save Grades</a>
            <a href="practiceflex.html" class="box">Practice Flex</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Portfolio | Tabarnilla Chelsea Mae</p>
    </footer>
</body>
</html>
